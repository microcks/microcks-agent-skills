openapi: 3.0.3
info:
  title: Pet adoption API
  version: 1.0.0
paths:
  /pets:
    get:
      summary: List pets available for adoption
      responses:
        '200':
          description: Available pets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pet'
    post:
      summary: Register a pet for adoption
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Pet'
      responses:
        '201':
          description: Pet registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
components:
  schemas:
    Pet:
      type: object
      required: [id, name, species, adoptionStatus]
      properties:
        id:
          type: string
          example: pet-42
        name:
          type: string
          example: Luna
        species:
          type: string
          enum: [cat, dog]
        adoptionStatus:
          type: string
          enum: [available, adopted]
